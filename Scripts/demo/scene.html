<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>scene</title>
<style>
  :root {
    --wall-a: #e7e4dd; --wall-b: #d5d2ca;
    --win: #ffffff; --bar: #f2f1ee; --side: #f6f5f2; --edge: rgba(0,0,0,.10);
    --dot: #d7d5d0; --ln: #f0eeea;
    --c1: #c8d3e6; --c2: #d9cbe6; --c3: #cfe0cf; --c4: #e3dcc9; --c5: #dddbd6;
    --sel: #e9eef7; --label: #55534e;
  }
  .dark {
    --wall-a: #2b2b2e; --wall-b: #18181a;
    --win: #1e1e20; --bar: #2a2a2c; --side: #242426; --edge: rgba(255,255,255,.08);
    --dot: #4a4a4d; --ln: #2f2f32;
    --c1: #3c4a63; --c2: #4f3f63; --c3: #3d5442; --c4: #5b5240; --c5: #3a3a3d;
    --sel: #2c3343; --label: #a6a4a0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body { background: linear-gradient(160deg, var(--wall-a), var(--wall-b)); position: relative;
         font-family: -apple-system, sans-serif; }

  /* 代码画出来的“手上的工作”：一个编辑器窗口，只用色块，不放文字 */
  .work { position: absolute; background: var(--win); border-radius: 14px; overflow: hidden;
          box-shadow: 0 0 0 .5px var(--edge), 0 18px 50px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.08); display: flex; flex-direction: column; }
  .work .title { height: 46px; background: var(--bar); display: flex; align-items: center; gap: 8px; padding: 0 18px; border-bottom: 1px solid var(--edge); flex: none; }
  .work .title i { width: 12px; height: 12px; border-radius: 50%; background: var(--dot); }
  .work .body { flex: 1; display: flex; }
  .work .side { width: 190px; background: var(--side); border-right: 1px solid var(--edge); padding: 18px 14px; }
  .work .side b { display: block; height: 10px; border-radius: 5px; background: var(--c5); margin: 14px 0; }
  .work .side b.on { background: var(--sel); height: 26px; margin: 8px -6px; border-radius: 6px; }
  .work .code { flex: 1; padding: 22px 26px; }
  .work .row { display: flex; gap: 8px; height: 26px; align-items: center; }
  .work .row span { height: 10px; border-radius: 5px; }
  .work .row.cursor { background: var(--ln); margin: 0 -26px; padding: 0 26px; }

  /* 窗口原图四角是不透明白色，按 macOS 窗口圆角裁掉；阴影加在外层 */
  .mini img { display: block; width: 100%; border-radius: 10.25px; }
  .mini { position: absolute; filter: drop-shadow(0 0 .5px rgba(0,0,0,.35)) drop-shadow(0 16px 36px rgba(0,0,0,.22)); }
  .dark .mini { filter: drop-shadow(0 0 .5px rgba(0,0,0,.8)) drop-shadow(0 16px 36px rgba(0,0,0,.5)); }
  .cap { position: absolute; font-size: 17px; color: var(--label); letter-spacing: .3px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const theme = q.get('theme'), lang = q.get('lang'), kind = q.get('kind');
  if (theme === 'dark') document.body.classList.add('dark');
  const img = (w, x, y) => {
    const el = document.createElement('div');
    el.className = 'mini';
    el.innerHTML = `<img src="raw/${theme}-${lang}-${w}.png">`;
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px';
    document.body.appendChild(el);
    return el;
  };
  const W = +q.get('w'), H = +q.get('h');
  document.documentElement.style.setProperty('--w', W + 'px');
  document.documentElement.style.setProperty('--h', H + 'px');

  if (kind === 'hero' || kind === 'corner') {
    // 编辑器窗口：固定伪随机的“代码行”
    const work = document.createElement('div');
    work.className = 'work';
    // corner：手机上用的裁切版，只露出编辑器的右侧
    const workLeft = kind === 'corner' ? -200 : 48;
    const workWidth = kind === 'corner' ? W - 48 - 320 - 40 + 200 : 752;
    Object.assign(work.style, { left: workLeft + 'px', top: '48px', width: workWidth + 'px', height: (H - 96) + 'px' });
    let seed = 7;
    const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const colors = ['--c1', '--c2', '--c3', '--c4', '--c5'];
    let rows = '';
    let indent = 0;
    for (let i = 0; i < 22; i++) {
      if (i % 6 === 0) indent = 0; else if (i % 6 === 1) indent = 1; else if (rnd() < .3) indent = Math.min(indent + 1, 3); else if (rnd() < .3) indent = Math.max(indent - 1, 1);
      const blank = i % 6 === 5;
      let spans = `<span style="width:${indent * 28}px"></span>`;
      if (!blank) {
        const n = 1 + Math.floor(rnd() * 3);
        for (let k = 0; k < n; k++) spans += `<span style="width:${30 + Math.floor(rnd() * 110)}px;background:var(${colors[Math.floor(rnd() * colors.length)]})"></span>`;
      }
      rows += `<div class="row${i === 9 ? ' cursor' : ''}">${spans}</div>`;
    }
    let side = '';
    for (let i = 0; i < 12; i++) side += `<b class="${i === 3 ? 'on' : ''}" style="width:${i === 3 ? '' : (50 + Math.floor(rnd() * 45)) + '%'};margin-left:${i % 4 ? 14 : 0}px"></b>`;
    work.innerHTML = `<div class="title"><i></i><i></i><i></i></div><div class="body"><div class="side">${side}</div><div class="code">${rows}</div></div>`;
    document.body.appendChild(work);
    img(320, W - 48 - 320, 48);
  } else if (kind === 'bars') {
    // 手机上用：三种宽度只保留窗口顶部，竖着排
    let y = 36;
    for (const w of [420, 300, 228]) {
      const el = img(w, 36, y);
      el.innerHTML = `<div style="height:84px;overflow:hidden;border-radius:10.25px"><img src="raw/${theme}-${lang}-${w}.png" style="border-radius:0"></div>`;
      const cap = document.createElement('div');
      cap.className = 'cap'; cap.textContent = `${w} pt`;
      cap.style.left = (36 + w + 24) + 'px'; cap.style.top = (y + 30) + 'px';
      document.body.appendChild(cap);
      y += 84 + 28;
    }
  } else if (kind === 'widths') {
    const ws = [420, 300, 228], gap = 64;
    const total = ws.reduce((a, b) => a + b, 0) + gap * (ws.length - 1);
    let x = (W - total) / 2;
    const y = 52;
    for (const w of ws) {
      img(w, x, y);
      const cap = document.createElement('div');
      cap.className = 'cap'; cap.textContent = `${w} pt`;
      cap.style.left = x + 'px'; cap.style.top = (y + 420 + 22) + 'px';
      cap.style.width = w + 'px'; cap.style.textAlign = 'center';
      document.body.appendChild(cap);
      x += w + gap;
    }
  }
</script>
</body>
</html>
